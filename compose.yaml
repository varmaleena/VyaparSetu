services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: vyaparsetu
      POSTGRES_USER: vyaparsetu
      POSTGRES_PASSWORD: vyaparsetu
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "vyaparsetu", "-d", "vyaparsetu"]
      interval: 2s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  postgres_data:
